# Until @zephyrex/auth, @jgrieve/forms and zod2gql are published, resolve them from the
# sibling checkouts. `file:` installs a copy whose peers (react, next, zod) resolve from
# this package, so there is one React and one zod; `link:` would not. Remove once published.
overrides:
  '@zephyrex/auth': file:../auth
  '@jgrieve/forms': file:../dynamic-form
  zod2gql: file:../zod2gql

allowBuilds:
  '@swc/core': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
